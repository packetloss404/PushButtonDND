name: Firmware and browser tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install real browsers and MQTT broker
        run: |
          python -m playwright install --with-deps chromium firefox webkit
          sudo apt-get update
          sudo apt-get install -y mosquitto
      - name: Compile firmware sources
        run: python -m compileall -q config.py desk.py door.py mqtt_client.py http_utils.py
      - name: Test firmware, broker integration, and browsers
        env:
          REQUIRE_MQTT_BROKER: '1'
        run: python -m pytest -v --junitxml=test-results/junit.xml
      - name: Upload test reports and browser traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7
